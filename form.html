<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML From</title>
</head>
<body>
    <h3>From Control html</h3>
    <form class="" action="index.html" method="poat">
        <table>
            <tr>
                <td>Input Teks</td>
                <td><input type="date" nama="" id=""
                placaholder="Input Nama"></td>
            </tr>
            <tr>
                <td>TextArea</td>
                <td><textarea name="alamat" id="alamat" clos="30" rows="5" placeholder="Inputkan alamat"></textarea></td>
            </tr>
            <tr>
                <td>Input Number</td>
                <td><input type="number" name="angka" value="" placeholder="usia"></td>
            </tr>
            <tr>
                <td>Input Password</td>
                <td><input type="password" name="password" value="" placeholder="password"></td>
            </tr>
            <tr>
               <td>Input Data</td>
               <td><input type="date" nama="tanggal" value=""></td>
            </tr>
            <tr>
                <td>Input Time</td>
                <td><input type="time" nama="jam" value=""></td>
            </tr>
            <tr>
                <td>Input Range</td>
                <td><input type="range" nama="range" value=""></td>
            </tr>
            <tr>
                <td>Input Radio</td>
                <td>
                    <input type="radio" nama="gender" value="L">pria
                    <input type="radio" nama="gender" value="P">perempuan
                </td>
            </tr>
            <tr>
                <td>Checkbox</td>
                <td>
                    <input type="checkbox" nama="hobi[]" value="basket">basket
                    <input type="checkbox" nama="hobi[]" value="sepak bola">sepak bola
                    <input type="checkbox" nama="hobi[]" value="paskib">paskib
                </td>
            </tr>
            <tr>
                <td>Combo Box</td>
                <td>
                    <select name="jurusan">
                        <option value="">--pilih jurusan--</option>
                        <option value="RPL">Rekayasa Perangkat Lunak</option>
                        <option value="TKJ">Teknik Komputer dan Jaringan</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Input File</td>
                <td><input type="file" nama="file" value=""></td>
            </tr>
            <tr>
                <td>Input Color</td>
                <td><input type="color" nama="warna" value=""></td>
            </tr>
            <tr>
                <td>Tombol</td>
                <td>
                    <button type="button" nama="button">Tombol Biasa</button>
                    <button type="submit" nama="button">Tombol submit data</button>
                    <button type="reset" name="button">Tombol reset</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
